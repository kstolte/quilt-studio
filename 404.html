<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Quilt Studio</title>
    <!--
      GitHub Pages SPA fallback (single-page-apps-for-github-pages technique).
      pathSegmentsToKeep = 1 keeps the "/quilt-studio" base segment, stashes the rest
      of the route in the query, and redirects to index.html, which decodes it back.
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
